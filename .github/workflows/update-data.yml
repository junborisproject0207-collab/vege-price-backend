name: Update vege backend data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22,1,2,3,4,14 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if API has newer trade_date
        id: check_update
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");

          const API_URL = "https://data.moa.gov.tw/Service/OpenData/FromM/FarmTransData.aspx";
          const OUTPUT_FILE = process.env.GITHUB_OUTPUT;

          function setOutput(name, value) {
            fs.appendFileSync(OUTPUT_FILE, `${name}=${value}\n`);
          }

          function normalizeTradeDate(dateStr) {
            if (!dateStr || typeof dateStr !== "string") return null;
            const m = dateStr.match(/^(\d{2,3})\.(\d{2})\.(\d{2})$/);
            if (!m) return null;
            return `${m[1].padStart(3, "0")}${m[2]}${m[3]}`;
          }

          function getTradeDateFromRow(row) {
            return row?.trade_date ?? row?.["交易日期"] ?? null;
          }

          function getMaxTradeDateFromRecords(records) {
            let maxRaw = null;
            let maxNorm = null;

            for (const row of records) {
              const raw = getTradeDateFromRow(row);
              const norm = normalizeTradeDate(raw);
              if (!norm) continue;

              if (!maxNorm || norm > maxNorm) {
                maxNorm = norm;
                maxRaw = raw;
              }
            }

            return maxRaw;
          }

          function getRepoLatestDate() {
            const file = "./public/prices/latest.json";
            if (!fs.existsSync(file)) return null;

            const json = JSON.parse(fs.readFileSync(file, "utf8"));

            if (Array.isArray(json)) {
              return getMaxTradeDateFromRecords(json);
            }

            if (json && Array.isArray(json.records)) {
              return getMaxTradeDateFromRecords(json.records);
            }

            return null;
          }

          function getApiRecords(apiJson) {
            if (Array.isArray(apiJson)) return apiJson;
            if (apiJson && Array.isArray(apiJson.records)) return apiJson.records;
            return [];
          }

          async function main() {
            const res = await fetch(API_URL, {
              headers: { accept: "application/json" }
            });

            if (!res.ok) {
              throw new Error(`Fetch API failed: ${res.status} ${res.statusText}`);
            }

            const apiJson = await res.json();
            const apiRecords = getApiRecords(apiJson);
            const apiDate = getMaxTradeDateFromRecords(apiRecords);
            const repoDate = getRepoLatestDate();

            console.log("API records length:", apiRecords.length);
            console.log("API latest trade_date:", apiDate);
            console.log("Repo latest trade_date:", repoDate);

            if (!apiDate) {
              throw new Error("API trade_date not found");
            }

            const apiNorm = normalizeTradeDate(apiDate);
            const repoNorm = normalizeTradeDate(repoDate);
            const shouldUpdate = !repoNorm || apiNorm > repoNorm ? "true" : "false";

            setOutput("api_trade_date", apiDate);
            setOutput("repo_trade_date", repoDate ?? "");
            setOutput("should_update", shouldUpdate);

            console.log("should_update =", shouldUpdate);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Skip because no newer data
        if: steps.check_update.outputs.should_update != 'true'
        run: |
          echo "No newer trade_date from API."
          echo "API:  ${{ steps.check_update.outputs.api_trade_date }}"
          echo "Repo: ${{ steps.check_update.outputs.repo_trade_date }}"

      - name: Run fetch master
        if: steps.check_update.outputs.should_update == 'true'
        run: node ./scripts/fetch-master.mjs

      - name: Run build master
        if: steps.check_update.outputs.should_update == 'true'
        run: node ./scripts/build-master.mjs

      - name: Run build price daily
        if: steps.check_update.outputs.should_update == 'true'
        run: node ./scripts/build-price-daily.mjs

      - name: Run analyze unmatched
        if: steps.check_update.outputs.should_update == 'true'
        run: node ./scripts/analyze-unmatched.mjs

      - name: Update version and summary timestamp
        if: steps.check_update.outputs.should_update == 'true'
        run: node ./scripts/update-meta.mjs

      - name: Commit and push if changed
        if: steps.check_update.outputs.should_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No file changes after build, skip commit."
          else
            git commit -m "chore: update backend data"
            git push
          fi